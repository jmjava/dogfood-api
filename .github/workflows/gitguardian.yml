# Fail closed if a commit contains a secret. Requires repo Actions secret
# GITGUARDIAN_API_KEY (GitGuardian workspace API token). Add "GitGuardian scan"
# as a required status check so a red scan cannot merge.
# https://docs.gitguardian.com/ggshield-docs/integrations/cicd-integrations/github-actions
name: GitGuardian scan

on:
  push:
  pull_request:

jobs:
  scanning:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require GITGUARDIAN_API_KEY
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "GITGUARDIAN_API_KEY is not set on this repository."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "Without it, secret scans cannot run and this check must fail."
            exit 1
          fi
      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@v1.54.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
